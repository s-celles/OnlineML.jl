name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

# Required for julia-actions/cache to delete old caches
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'    # Minimum supported (compat)
          - '1'       # Latest stable
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # Clear any cached compiled artifacts for OnlineML to ensure fresh compilation
      - name: Clear OnlineML compiled cache
        shell: bash
        run: |
          julia -e '
            compiled_path = joinpath(first(DEPOT_PATH), "compiled")
            if isdir(compiled_path)
              for (root, dirs, files) in walkdir(compiled_path)
                for f in files
                  if occursin("OnlineML", f)
                    rm(joinpath(root, f), force=true)
                  end
                end
              end
            end
          '

      - uses: julia-actions/julia-runtest@v1
        env:
          DATADEPS_ALWAYS_ACCEPT: true
        with:
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
